name: UbayHub Blora CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "release/*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-build:
    name: 🛡️ Code Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Runtime (v20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🔍 TypeScript Syntax & Type Safety Check
        run: npm run lint

      - name: ⚡ Compile Vite & Express Bundles
        run: npm run build

      - name: 🧪 Verify Production Build Output
        run: |
          test -f dist/server.cjs || (echo "Missing dist/server.cjs" && exit 1)
          test -f dist/index.html || (echo "Missing dist/index.html" && exit 1)

  docker-build:
    name: 🐳 Docker Multi-Stage Image Build Test
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ubayhub-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Production Container Deployment
    runs-on: ubuntu-latest
    needs: [lint-and-build, docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 📣 Deployment Notification
        run: |
          echo "================================================="
          echo "✅ CI/CD BUILD SUCCESSFUL!"
          echo "🚀 Deploying UbayHub Blora to Production Container"
          echo "================================================="
